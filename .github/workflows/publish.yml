name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Check version matches release tag
        run: |
          PKG_VERSION=$(python -c "exec(open('src/bonepick/version.py').read()); print(__version__)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: version.py has '$PKG_VERSION' but release tag is '$TAG_VERSION'"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  bump-version:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump minor version
        run: |
          CURRENT=$(python -c "exec(open('src/bonepick/version.py').read()); print(__version__)")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
          echo "__version__ = \"$NEW_VERSION\"" > src/bonepick/version.py
          echo "Bumped version: $CURRENT -> $NEW_VERSION"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(python -c "exec(open('src/bonepick/version.py').read()); print(__version__)")
          git add src/bonepick/version.py
          git commit -m "Bump version to $NEW_VERSION"
          git push
